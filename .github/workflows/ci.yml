name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: billetera
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d billetera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/billetera
      DB_USERNAME: admin
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chromium for Playwright
        run: |
          chmod +x mvnw
          ./mvnw -B -Pe2e exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            "-Dexec.args=install --with-deps chromium" \
            -Dexec.classpathScope=test
      - name: Run unit, integration and browser tests
        run: ./mvnw -B -Pe2e verify
      - name: Upload browser screenshots after failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: target/e2e-artifacts/
          if-no-files-found: ignore
