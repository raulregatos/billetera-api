spring.application.name=billetera
spring.profiles.default=local

# Conexión al contenedor PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billetera}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway administra el esquema. Las bases de datos ya existentes se marcan en la versión 1
# y reciben solo las migraciones nuevas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
